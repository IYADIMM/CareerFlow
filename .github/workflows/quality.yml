name: CareerFlow quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-synthetic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm eval:agent
      - run: pnpm audit --prod
